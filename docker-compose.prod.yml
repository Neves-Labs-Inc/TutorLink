# Production stack for a single host. Images are prebuilt; nothing is built here.
# Every ${VAR} comes from the .env next to this file (see scripts/smoke-prod.sh for a full example).
name: tutorlink

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    # No ports: the database is reachable only from the compose network.
    volumes:
      - ${DATA_DIR:?DATA_DIR is required}/pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP: during initdb Postgres listens only on the Unix socket, so a first boot isn't
      # reported healthy (and migrations don't start) until initialization has finished.
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    env_file: .env
    environment:
      # Forced off whatever .env says: debug mode drops the Secure flag on the refresh cookie.
      DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Certificates and the ACME account live here, so they survive instance replacement.
      - ${DATA_DIR}/caddy/data:/data
      - ${DATA_DIR}/caddy/config:/config
    # Caddy runs as root to bind 80/443; drop every other capability so a compromise gets
    # little more than the ability to serve files and bind ports.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      - api
    restart: unless-stopped
