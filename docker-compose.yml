services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE}
      # Defaulted because an unset var would pass an empty string, which the validator refuses.
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-UTC}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_STATUS_CALLBACK_URL: ${TWILIO_STATUS_CALLBACK_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SMTP_HOST: ${SMTP_HOST}
      # Defaulted for the same reason as BUSINESS_TIMEZONE: an unset var passes "", not an int.
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    # `--reload` lives here, not in the image's CMD, so that the image is production-correct.
    # `--no-proxy-headers` is repeated because this overrides the CMD wholesale: dropping it
    # would arm uvicorn's own forwarded-header trust alongside the application's. See the
    # comment block above the CMD in docker/api.Dockerfile.
    command:
      - uv
      - run
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --no-proxy-headers
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../docker/dashboard.Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET}
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      # Anonymous volume keeps the image's node_modules from being shadowed by the bind mount.
      - /app/node_modules

volumes:
  pgdata:
